CONFIG_LEGACY_GENERATED_INCLUDE_PATH=n

CONFIG_MAIN_STACK_SIZE=2048

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_EARLY_CONSOLE=y
# Console/shell go to &uart0 (set in the overlay).

# --- Display: ST7701 over MIPI-DSI (espressif host + DSI scanout drivers) ---
CONFIG_DISPLAY=y
CONFIG_ST7701=y
CONFIG_MIPI_DSI=y
CONFIG_MIPI_DSI_ESP32=y
CONFIG_DISPLAY_ESP32_DSI=y
# user_display.c renders straight into display_get_framebuffer() and never
# calls display_write(); with one framebuffer that is the buffer scanned out.
CONFIG_DISPLAY_ESP32_DSI_FB_NUM=1
# Regulator needed: MIPI-DSI D-PHY VDD is fed from an internal LDO on the P4.
CONFIG_REGULATOR=y

CONFIG_GPIO=y
CONFIG_PINCTRL=y

# --- PSRAM (Guition JC4880P443C = 32MB; in-tree P4 base dtsi declares 8MB) ---
# MANDATORY: 480x800 8bpp double framebuffer = 1.5MB > 768KB P4 SRAM.
# Framebuffer/heap must live in PSRAM. TODO: if the base board dtsi caps PSRAM
# at 8MB, that still covers the 1.5MB framebuffer; bump only if you need >8MB.
CONFIG_ESP_SPIRAM=y

# --- Flash ---
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_XIP=y
CONFIG_MPU_ALLOW_FLASH_WRITE=y
CONFIG_CACHE=y

# DIO/40M: the Guition boya flash boots DIO; QIO's bootloader_enable_qio_mode
# crash-loops on the current hal base (upstream bug, rev<3.0).
CONFIG_ESPTOOLPY_FLASHMODE_DIO=y
CONFIG_ESPTOOLPY_FLASHFREQ_40M=y
CONFIG_ESPTOOLPY_HEADER_FLASHSIZE_UPDATE=y
CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y

# --- POSIX bits the game loop / timers rely on ---
CONFIG_POSIX_TIMERS=y
CONFIG_POSIX_MONOTONIC_CLOCK=y
CONFIG_POSIX_CLOCK_SELECTION=y
CONFIG_POSIX_THREADS=y
CONFIG_POSIX_SYSTEM_INTERFACES=y

CONFIG_DEBUG=y
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_DEBUG_OPTIMIZATIONS=y
# CONFIG_DEBUG_COREDUMP is not set

# CONFIG_BOOT_BANNER is not set
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_STACK_SENTINEL=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=4194304
